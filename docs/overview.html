<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenLink overview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1600px;
        padding: 44px 48px 40px;
        background: radial-gradient(70% 45% at 12% 0%, rgba(62, 168, 255, 0.12), transparent 65%),
          radial-gradient(60% 40% at 92% 100%, rgba(124, 242, 200, 0.1), transparent 70%), #050506;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      }
      header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
      .who { display: flex; align-items: center; gap: 16px; }
      .who img { width: 58px; height: 58px; border-radius: 14px; }
      h1 { margin: 0; font-size: 40px; letter-spacing: -0.03em; font-weight: 500; }
      .sub { margin-top: 6px; color: #8b8b93; font-size: 13px; letter-spacing: 0.02em; }
      .meta { text-align: right; font-size: 11px; line-height: 1.9; color: #6f6f78; letter-spacing: 0.16em; text-transform: uppercase; }
      .meta b { color: #c9c9d0; font-weight: 500; }
      section { margin-top: 34px; }
      h2 {
        margin: 0 0 14px;
        font-size: 10.5px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #74747d;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #1c1c22, transparent); }
      .rows { display: flex; flex-direction: column; gap: 20px; }
      .row { display: grid; gap: 16px; }
      .row.desktop { grid-template-columns: repeat(3, 1fr); }
      .row.phone { grid-template-columns: repeat(5, 1fr); }
      .row.phone.four { grid-template-columns: repeat(4, 1fr); }
      .row.mixed { grid-template-columns: 350px 350px minmax(0, 1fr); align-items: start; }
      .stack { display: flex; flex-direction: column; gap: 16px; }
      figure { margin: 0; }
      figure img {
        display: block;
        width: 100%;
        border: 1px solid #1b1b21;
        border-radius: 14px;
        background: #000;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      figcaption {
        margin-top: 9px;
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6f6f78;
      }
      footer {
        margin-top: 34px;
        display: flex;
        justify-content: space-between;
        font-size: 10.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4d4d55;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="who">
        <img src="logo.png" alt="OpenLink" />
        <div>
          <h1>OpenLink</h1>
          <div class="sub">Android ↔ Windows 10/11 continuity · local Wi-Fi or USB-C · no cloud, no account</div>
        </div>
      </div>
      <div class="meta">
        <div><b>MIT</b> licensed</div>
        <div>AES-256-GCM · ECDH P-256</div>
        <div>English · Deutsch</div>
      </div>
    </header>

    <section>
      <h2>Windows host</h2>
      <div class="rows">
        <div class="row desktop">
          <figure><img src="screenshots/desktop-link.png" alt="" /><figcaption>Link · pairing</figcaption></figure>
          <figure><img src="screenshots/desktop-sensors.png" alt="" /><figcaption>Sensors · 1 Hz</figcaption></figure>
          <figure><img src="screenshots/desktop-deck.png" alt="" /><figcaption>Macro deck</figcaption></figure>
        </div>
        <div class="row desktop">
          <figure><img src="screenshots/desktop-files.png" alt="" /><figcaption>Files</figcaption></figure>
          <figure><img src="screenshots/desktop-inbox.png" alt="" /><figcaption>Clipboard</figcaption></figure>
          <figure><img src="screenshots/desktop-settings.png" alt="" /><figcaption>Settings</figcaption></figure>
        </div>
      </div>
    </section>

    <section>
      <h2>Android</h2>
      <div class="row phone">
        <figure><img src="screenshots/android-home.png" alt="" /><figcaption>Home</figcaption></figure>
        <figure><img src="screenshots/android-sensors.png" alt="" /><figcaption>Sensors</figcaption></figure>
        <figure><img src="screenshots/android-deck.png" alt="" /><figcaption>Deck</figcaption></figure>
        <figure><img src="screenshots/android-clipboard.png" alt="" /><figcaption>Clipboard</figcaption></figure>
        <figure><img src="screenshots/android-settings.png" alt="" /><figcaption>Settings</figcaption></figure>
      </div>
    </section>

    <section>
      <h2>OLED standby · two designs, two orientations</h2>
      <div class="row mixed">
        <figure><img src="screenshots/android-standby.png" alt="" /><figcaption>Panels · portrait</figcaption></figure>
        <figure><img src="screenshots/android-standby-text.png" alt="" /><figcaption>Text only · portrait</figcaption></figure>
        <div class="stack">
          <figure><img src="screenshots/android-standby-landscape.png" alt="" /><figcaption>Panels · landscape</figcaption></figure>
          <figure><img src="screenshots/android-standby-text-landscape.png" alt="" /><figcaption>Text only · landscape</figcaption></figure>
        </div>
      </div>
    </section>

    <footer>
      <span>github.com/AeroBaden/OpenLink</span>
      <span>Zero telemetry · zero cloud</span>
    </footer>
  </body>
</html>
