name: Import payload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-payload

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/payload.tar.gz https://openlink-source-payload-q9crpt-preview.freebuff.site/openlink-fixes.tar.gz
          tar -xzf /tmp/payload.tar.gz -C .
          ls -la | head -20
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "OpenLink bot"
          git config user.email "openlink-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fix pairing window, desktop telemetry load and the app icon"
          git push origin HEAD:main
