name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source payload
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/openlink.tar.gz "https://openlink-source-payload-q9crpt-preview.freebuff.site/openlink.tar.gz"
          ls -l /tmp/openlink.tar.gz
          mkdir -p /tmp/src
          tar -xzf /tmp/openlink.tar.gz -C /tmp/src --exclude='.github'
          rsync -a --exclude='.github' /tmp/src/ ./
          ls -1

      - name: Commit the tree
        run: |
          set -euo pipefail
          git config user.name "OpenLink bootstrap"
          git config user.email "hello@openlink.local"
          git checkout -B main
          git add -A
          git commit -m "Import OpenLink 1.0.0 source"
          git push origin HEAD:main
